name: Update WAProto

on:
  schedule:
    - cron: "10 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-proto:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install proto extractor dependencies
        run: npm ci --prefix proto-extract

      - name: Extract latest WAProto
        id: proto_info
        shell: bash
        run: |
          npm --prefix proto-extract start | tee wa-logs.txt

          WA_VERSION=$(perl -ne 'print $1 if /Current version\: (.+)/' wa-logs.txt)
          WA_JS_URL=$(perl -ne 'print $1 if /Found source JS URL\: (.+)/' wa-logs.txt)

          if [ -z "$WA_VERSION" ]; then
            echo "Could not determine WhatsApp version."
            exit 1
          fi

          {
            echo "wa_version=$WA_VERSION"
            echo "wa_js_url=$WA_JS_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Generate WAProto statics
        shell: bash
        run: |
          npx pbjs             -t static-module             --no-beautify             -w es6             --no-bundle             --no-delimited             --no-verify             --no-comments             -o WAProto/index.js             WAProto/WAProto.proto

          npx pbjs             -t static-module             --no-beautify             -w es6             --no-bundle             --no-delimited             --no-verify             WAProto/WAProto.proto             | npx pbts --no-comments -o WAProto/index.d.ts -

          node WAProto/fix-imports.js

      - name: Update WhatsApp version file
        shell: bash
        env:
          WA_VERSION: ${{ steps.proto_info.outputs.wa_version }}
        run: |
          IFS='.' read -r V1 V2 V3 <<< "$WA_VERSION"

          if [ -z "$V1" ] || [ -z "$V2" ] || [ -z "$V3" ]; then
            echo "Unexpected WhatsApp version format: $WA_VERSION"
            exit 1
          fi

          printf '{\n\t"version": [%s, %s, %s]\n}\n' "$V1" "$V2" "$V3"             > src/Defaults/baileys-version.json

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update WAProto to v${{ steps.proto_info.outputs.wa_version }}"
          title: "chore: update WAProto to v${{ steps.proto_info.outputs.wa_version }}"
          branch: update-proto/stable
          delete-branch: true
          labels: update-proto
          body: |
            Automated WAProto update for Phoenix Baileys V3.

            WhatsApp version: `${{ steps.proto_info.outputs.wa_version }}`
            Source JS: `${{ steps.proto_info.outputs.wa_js_url }}`

            Please review the generated protocol changes before merging.
          add-paths: |
            WAProto/WAProto.proto
            WAProto/index.js
            WAProto/index.d.ts
            src/Defaults/baileys-version.json
