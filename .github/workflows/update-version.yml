name: Update WhatsApp Version

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update WhatsApp Web version
        run: npm run update:version

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update WhatsApp Web version"
          title: "chore: update WhatsApp Web version"
          branch: update-version/stable
          delete-branch: true
          labels: update-version
          body: |
            Automated WhatsApp Web version update for Phoenix Baileys V3.

            This pull request updates the WhatsApp Web client revision using the
            repository's `update:version` script.

            Review the generated changes before merging.
          add-paths: |
            src/Defaults/baileys-version.json
            src/Defaults/index.ts
            src/Utils/generics.ts
